global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'food-delivery-microservices'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 5s
    static_configs:
      - targets:
          - 'gateway-service:8080'
          - 'user-service:8081'
          - 'restaurant-service:8082'
          - 'order-service:8083'
          - 'payment-service:8084'
          - 'notification-service:8085'
          - 'discovery-service:8761'
          - 'config-server:8888'
        labels:
          application: 'food-delivery-platform'
