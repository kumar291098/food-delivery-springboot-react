version: '3.8'

services:
  # Central Configuration Server
  config-server:
    image: eclipse-temurin:17-jre
    container_name: config-server
    working_dir: /app
    volumes:
      - ./config-server/target:/app
      - ./config-repo:/config-repo
    ports:
      - "8888:8888"
    command: java -jar config-server-0.0.1-SNAPSHOT.jar
    environment:
      - JAVA_OPTS=-Xmx256m -Xms256m
      - SPRING_PROFILES_ACTIVE=native
      - SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS=file:/config-repo
    networks:
      - food-delivery-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 15

  # Eureka Discovery Server
  discovery-service:
    image: eclipse-temurin:17-jre
    container_name: discovery-service
    working_dir: /app
    volumes:
      - ./discovery-service/target:/app
    ports:
      - "8761:8761"
    command: java -jar discovery-service-0.0.1-SNAPSHOT.jar
    environment:
      - JAVA_OPTS=-Xmx256m -Xms256m
    networks:
      - food-delivery-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 15

  # API Gateway
  gateway-service:
    image: eclipse-temurin:17-jre
    container_name: gateway-service
    working_dir: /app
    volumes:
      - ./gateway-service/target:/app
    ports:
      - "8080:8080"
    depends_on:
      config-server:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      zipkin:
        condition: service_started
    command: java -jar gateway-service-0.0.1-SNAPSHOT.jar
    environment:
      - JAVA_OPTS=-Xmx256m -Xms256m
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:8888
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - food-delivery-network

  # User Service
  user-service:
    image: eclipse-temurin:17-jre
    container_name: user-service
    working_dir: /app
    volumes:
      - ./user-service/target:/app
    ports:
      - "8081:8081"
    depends_on:
      config-server:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      postgres:
        condition: service_started
      zipkin:
        condition: service_started
    command: java -jar user-service-0.0.1-SNAPSHOT.jar
    environment:
      - JAVA_OPTS=-Xmx256m -Xms256m
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:8888
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - food-delivery-network

  # Restaurant Service
  restaurant-service:
    image: eclipse-temurin:17-jre
    container_name: restaurant-service
    working_dir: /app
    volumes:
      - ./restaurant-service/target:/app
    ports:
      - "8082:8082"
    depends_on:
      config-server:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      postgres:
        condition: service_started
      zipkin:
        condition: service_started
    command: java -jar restaurant-service-0.0.1-SNAPSHOT.jar
    environment:
      - JAVA_OPTS=-Xmx256m -Xms256m
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:8888
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - food-delivery-network

  # Order Service
  order-service:
    image: eclipse-temurin:17-jre
    container_name: order-service
    working_dir: /app
    volumes:
      - ./order-service/target:/app
    ports:
      - "8083:8083"
    depends_on:
      config-server:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      postgres:
        condition: service_started
      zipkin:
        condition: service_started
    command: java -jar order-service-0.0.1-SNAPSHOT.jar
    environment:
      - JAVA_OPTS=-Xmx256m -Xms256m
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:8888
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - food-delivery-network

  # Payment Service
  payment-service:
    image: eclipse-temurin:17-jre
    container_name: payment-service
    working_dir: /app
    volumes:
      - ./payment-service/target:/app
    ports:
      - "8084:8084"
    depends_on:
      config-server:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      postgres:
        condition: service_started
      zipkin:
        condition: service_started
    command: java -jar payment-service-0.0.1-SNAPSHOT.jar
    environment:
      - JAVA_OPTS=-Xmx256m -Xms256m
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:8888
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - food-delivery-network

  # Notification Service
  notification-service:
    image: eclipse-temurin:17-jre
    container_name: notification-service
    working_dir: /app
    volumes:
      - ./notification-service/target:/app
    ports:
      - "8085:8085"
    depends_on:
      config-server:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      zipkin:
        condition: service_started
    command: java -jar notification-service-0.0.1-SNAPSHOT.jar
    environment:
      - JAVA_OPTS=-Xmx256m -Xms256m
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:8888
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - food-delivery-network

  # RabbitMQ Broker
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - food-delivery-network

  # PostgreSQL Database Server
  postgres:
    image: postgres:15-alpine
    container_name: postgres-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=root
    volumes:
      - ./init-db:/docker-entrypoint-initdb.d
      - postgres-data:/var/lib/postgresql/data
    networks:
      - food-delivery-network

  # Zipkin Tracing Dashboard
  zipkin:
    image: openzipkin/zipkin
    container_name: zipkin
    ports:
      - "9411:9411"
    networks:
      - food-delivery-network

  # Elasticsearch Database (Log Storage & Indexing)
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - food-delivery-network

  # Kibana Dashboard (Log Search & Analytics Web UI)
  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.4
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - food-delivery-network

  # Prometheus Time-Series Metrics Collector
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - food-delivery-network

  # Grafana Visual Real-Time Dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - food-delivery-network

  # Uptime Kuma (Self-Hosted Live Status Page & Uptime Alerts)
  uptime-kuma:
    image: louislam/uptime-kuma:latest
    container_name: uptime-kuma
    ports:
      - "3001:3001"
    volumes:
      - uptime-kuma-data:/app/data
    networks:
      - food-delivery-network

networks:
  food-delivery-network:
    driver: bridge

volumes:
  postgres-data:
  elasticsearch-data:
  prometheus-data:
  grafana-data:
  uptime-kuma-data:
