version: '3.8'

services:
  # Central Configuration Server
  config-server:
    image: openjdk:17-jdk-slim
    container_name: config-server
    working_dir: /app
    volumes:
      - ./config-server/target:/app
      - ./config-repo:/config-repo
    ports:
      - "8888:8888"
    command: java -jar config-server-0.0.1-SNAPSHOT.jar
    environment:
      - JAVA_OPTS=-Xmx256m -Xms256m
      - SPRING_PROFILES_ACTIVE=native
      - SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS=file:/config-repo
    networks:
      - food-delivery-network

  # Eureka Discovery Server
  discovery-service:
    image: openjdk:17-jdk-slim
    container_name: discovery-service
    working_dir: /app
    volumes:
      - ./discovery-service/target:/app
    ports:
      - "8761:8761"
    command: java -jar discovery-service-0.0.1-SNAPSHOT.jar
    environment:
      - JAVA_OPTS=-Xmx256m -Xms256m
    networks:
      - food-delivery-network
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8761 && exec 3>&- || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # API Gateway
  gateway-service:
    image: openjdk:17-jdk-slim
    container_name: gateway-service
    working_dir: /app
    volumes:
      - ./gateway-service/target:/app
    ports:
      - "8080:8080"
    depends_on:
      - config-server
      - discovery-service
      - zipkin
    command: java -jar gateway-service-0.0.1-SNAPSHOT.jar
    environment:
      - JAVA_OPTS=-Xmx256m -Xms256m
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:8888
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - food-delivery-network

  # User Service
  user-service:
    image: openjdk:17-jdk-slim
    container_name: user-service
    working_dir: /app
    volumes:
      - ./user-service/target:/app
    ports:
      - "8081:8081"
    depends_on:
      - config-server
      - discovery-service
      - postgres
      - zipkin
    command: java -jar user-service-0.0.1-SNAPSHOT.jar
    environment:
      - JAVA_OPTS=-Xmx256m -Xms256m
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:8888
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - food-delivery-network

  # Restaurant Service
  restaurant-service:
    image: openjdk:17-jdk-slim
    container_name: restaurant-service
    working_dir: /app
    volumes:
      - ./restaurant-service/target:/app
    ports:
      - "8082:8082"
    depends_on:
      - config-server
      - discovery-service
      - postgres
      - zipkin
    command: java -jar restaurant-service-0.0.1-SNAPSHOT.jar
    environment:
      - JAVA_OPTS=-Xmx256m -Xms256m
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:8888
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - food-delivery-network

  # Order Service
  order-service:
    image: openjdk:17-jdk-slim
    container_name: order-service
    working_dir: /app
    volumes:
      - ./order-service/target:/app
    ports:
      - "8083:8083"
    depends_on:
      - config-server
      - discovery-service
      - rabbitmq
      - postgres
      - zipkin
    command: java -jar order-service-0.0.1-SNAPSHOT.jar
    environment:
      - JAVA_OPTS=-Xmx256m -Xms256m
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:8888
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - food-delivery-network

  # Payment Service
  payment-service:
    image: openjdk:17-jdk-slim
    container_name: payment-service
    working_dir: /app
    volumes:
      - ./payment-service/target:/app
    ports:
      - "8084:8084"
    depends_on:
      - config-server
      - discovery-service
      - postgres
      - zipkin
    command: java -jar payment-service-0.0.1-SNAPSHOT.jar
    environment:
      - JAVA_OPTS=-Xmx256m -Xms256m
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:8888
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - food-delivery-network

  # Notification Service
  notification-service:
    image: openjdk:17-jdk-slim
    container_name: notification-service
    working_dir: /app
    volumes:
      - ./notification-service/target:/app
    ports:
      - "8085:8085"
    depends_on:
      - config-server
      - discovery-service
      - rabbitmq
      - zipkin
    command: java -jar notification-service-0.0.1-SNAPSHOT.jar
    environment:
      - JAVA_OPTS=-Xmx256m -Xms256m
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:8888
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - food-delivery-network

  # RabbitMQ Broker
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - food-delivery-network

  # PostgreSQL Database Server
  postgres:
    image: postgres:15-alpine
    container_name: postgres-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=root
    volumes:
      - ./init-db:/docker-entrypoint-initdb.d
      - postgres-data:/var/lib/postgresql/data
    networks:
      - food-delivery-network

  # Zipkin Tracing Dashboard
  zipkin:
    image: openzipkin/zipkin
    container_name: zipkin
    ports:
      - "9411:9411"
    networks:
      - food-delivery-network

networks:
  food-delivery-network:
    driver: bridge

volumes:
  postgres-data:
