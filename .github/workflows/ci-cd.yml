name: Food Delivery System CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      target_service:
        description: 'Target Microservice to Test/Build (or "ALL")'
        required: false
        default: 'ALL'
        type: choice
        options:
          - ALL
          - user-service
          - restaurant-service
          - order-service
          - payment-service
          - notification-service
          - gateway-service
          - discovery-service
          - config-server
      push_images:
        description: 'Push Docker images to Registry (GHCR)'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  checks: write
  pull-requests: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================================================
  # Stage 1: Quality Check & Linting
  # ============================================================================
  quality-check:
    name: 🔍 Code Quality & POM Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make Maven wrapper executable
        run: chmod +x mvnw || true

      - name: Validate Maven POMs
        run: |
          echo "Validating root and submodule POM configurations..."
          ./mvnw validate -B

      - name: Dependency Check / Security Scan Notice
        run: |
          echo "POM validation passed successfully."

  # ============================================================================
  # Stage 2: Containerized Test Runner Image Creation & Execution
  # ============================================================================
  docker-test-runner:
    name: 🐳 Docker Test Runner Image & Execution
    runs-on: ubuntu-latest
    needs: [ quality-check ]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || inputs.push_images == true)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Test Runner Image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-test-runner
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      - name: Build & Cache Test Runner Docker Image
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.test-runner
          push: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || inputs.push_images == true) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          load: true
          cache-from: type=gha,scope=test-runner
          cache-to: type=gha,mode=max,scope=test-runner

      - name: Create Test Reports Directory
        run: mkdir -p target/test-reports

      - name: Execute Tests inside Test Runner Docker Container
        run: |
          echo "Running microservices tests inside isolated Docker Test Runner container..."
          docker run --rm \
            -e TARGET_SERVICE="${{ inputs.target_service || 'ALL' }}" \
            -v ${{ github.workspace }}/target/test-reports:/workspace/target/test-reports \
            ${{ steps.meta.outputs.tags != '' && fromJSON(steps.meta.outputs.json).tags[0] || 'docker-test-runner:local' }}

      - name: Upload Container Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-container-test-reports
          path: |
            **/target/surefire-reports/*.xml
            **/target/surefire-reports/*.txt
          if-no-files-found: ignore
          retention-days: 14

  # ============================================================================
  # Stage 3: Backend Services Parallel Test Matrix
  # ============================================================================
  backend-matrix-test:
    name: ☕ Test Service - ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [ quality-check ]
    strategy:
      fail-fast: false
      matrix:
        service:
          - config-server
          - discovery-service
          - gateway-service
          - user-service
          - restaurant-service
          - order-service
          - payment-service
          - notification-service
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make Maven wrapper executable
        run: chmod +x mvnw || true

      - name: Run Unit & Integration Tests for ${{ matrix.service }}
        run: |
          echo "Testing ${{ matrix.service }}..."
          ./mvnw test -pl ${{ matrix.service }} -am -B

      - name: Upload Surefire Test Results for ${{ matrix.service }}
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.service }}
          path: ${{ matrix.service }}/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 14

  # ============================================================================
  # Stage 4: Frontend Build & Verification Matrix
  # ============================================================================
  frontend-verification:
    name: ⚛️ Frontend Build - ${{ matrix.app }}
    runs-on: ubuntu-latest
    needs: [ quality-check ]
    strategy:
      fail-fast: false
      matrix:
        app:
          - frontend-user
          - frontend-restaurant
          - frontend-delivery
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install Dependencies
        working-directory: ${{ matrix.app }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build Application
        working-directory: ${{ matrix.app }}
        run: npm run build

  # ============================================================================
  # Stage 5: Microservices Docker Images Build & Push Matrix
  # ============================================================================
  docker-build-services:
    name: 📦 Docker Build - ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [ backend-matrix-test, docker-test-runner ]
    if: success()
    strategy:
      fail-fast: false
      matrix:
        service:
          - config-server
          - discovery-service
          - gateway-service
          - user-service
          - restaurant-service
          - order-service
          - payment-service
          - notification-service
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || inputs.push_images == true)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for ${{ matrix.service }}
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.service }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      - name: Build & Push Docker Image for ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || inputs.push_images == true) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # ============================================================================
  # Stage 6: Pipeline Dashboard & Summary
  # ============================================================================
  pipeline-summary:
    name: 📊 Pipeline Summary & Status Dashboard
    runs-on: ubuntu-latest
    needs:
      - quality-check
      - docker-test-runner
      - backend-matrix-test
      - frontend-verification
      - docker-build-services
    if: always()
    steps:
      - name: Generate Pipeline Summary Report
        run: |
          echo "## 🚀 CI/CD Pipeline Summary Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status | Details |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Code Quality & POM Validation** | ${{ needs.quality-check.result == 'success' && '✅ Passed' || '❌ Failed' }} | Maven POM & dependency checks |" >> $GITHUB_STEP_SUMMARY
          echo "| **Docker Test Runner Image Creation** | ${{ needs.docker-test-runner.result == 'success' && '✅ Passed' || '❌ Failed' }} | Built & executed containerized test runner |" >> $GITHUB_STEP_SUMMARY
          echo "| **Backend Services Matrix Tests** | ${{ needs.backend-matrix-test.result == 'success' && '✅ Passed' || '❌ Failed' }} | 8 Microservices unit & integration tests |" >> $GITHUB_STEP_SUMMARY
          echo "| **Frontend Build Verification** | ${{ needs.frontend-verification.result == 'success' && '✅ Passed' || '❌ Failed' }} | 3 React frontends built |" >> $GITHUB_STEP_SUMMARY
          echo "| **Microservices Docker Images** | ${{ needs.docker-build-services.result == 'success' && '✅ Passed' || '❌ Failed' }} | Built 8 microservice container images |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Built Container Images" >> $GITHUB_STEP_SUMMARY
          echo "- \`food-delivery-test-runner:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`config-server:latest\`, \`discovery-service:latest\`, \`gateway-service:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`user-service:latest\`, \`restaurant-service:latest\`, \`order-service:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`payment-service:latest\`, \`notification-service:latest\`" >> $GITHUB_STEP_SUMMARY
