apiVersion: logging.openshift.io/v1
kind: ClusterLogForwarder
metadata:
  name: instance
  namespace: openshift-logging
spec:
  pipelines:
    - name: food-delivery-application-logs
      inputRefs:
        - application
      outputRefs:
        - default
      labels:
        platform: food-delivery
        environment: production
        log_format: json
